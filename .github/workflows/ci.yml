name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (web)
        run: npm ci
        working-directory: web

      - name: Lint backend
        run: npm run lint --if-present
        continue-on-error: true

      - name: Lint web
        run: npm run lint --if-present
        working-directory: web
        continue-on-error: true

      - name: Type check backend
        run: npx tsc --noEmit

      - name: Type check web
        run: npx tsc --noEmit
        working-directory: web

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test --if-present
        env:
          NODE_ENV: test

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run web tests
        run: npm test -- --run
        working-directory: web
        env:
          NODE_ENV: test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (web)
        run: npm ci
        working-directory: web

      - name: Build backend
        run: npm run build --if-present

      - name: Build web
        run: npm run build
        working-directory: web
        env:
          # Skip type checking during build (already done in lint-and-typecheck)
          NEXT_TELEMETRY_DISABLED: 1
